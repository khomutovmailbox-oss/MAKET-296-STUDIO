name: Build MAKET 296 Qt6 for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-qt6:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
      - name: Extract exact Qt source and original vector templates
        shell: pwsh
        run: |
          $archive = 'MAKET_296_QT6_EXACT_SOURCE.zip'
          if (-not (Test-Path $archive)) { throw 'Exact source archive is missing' }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          if (-not (Test-Path 'src/main.cpp')) { throw 'Qt source code not found' }
          if (-not (Test-Path 'assets/templates/overlay_00.svg')) { throw 'Original vector template assets not found' }
      - name: Apply full editable-object, crop and group-size editor patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'patches/editor_v7_diff/*.b64' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 editor patch chunks, found $($parts.Count)" }
          $b64 = (($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }) -join '')
          [System.IO.File]::WriteAllBytes('editor_v7_src.patch.xz',[Convert]::FromBase64String($b64))
          python -c "import lzma,pathlib; pathlib.Path('editor_v7_src.patch').write_bytes(lzma.decompress(pathlib.Path('editor_v7_src.patch.xz').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decompress editor source patch' }
          git apply --whitespace=nowarn editor_v7_src.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply editable editor patch' }
          python -X utf8 scripts/fix_editor_v7.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply editor interaction fixes' }
          python -X utf8 scripts/prepare_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not add editable SVG element IDs' }
      - name: Enable editable original vector text and validate multi-photo PDF
        shell: pwsh
        run: |
          python -X utf8 patches/finish_editor_v7.py
          if ($LASTEXITCODE -ne 0) { throw 'Editor finishing patch failed' }
      - name: Apply v8 reference comparison and precision editor controls
        shell: pwsh
        run: |
          git apply --check patches/editor_v8_accuracy_and_ux.patch
          if ($LASTEXITCODE -ne 0) { throw 'V8 source mismatch' }
          git apply --whitespace=nowarn patches/editor_v8_accuracy_and_ux.patch
          if ($LASTEXITCODE -ne 0) { throw 'V8 editor patch failed' }
      - name: Install Qt 6.8.3 and SVG
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: 'qtbase qtsvg'
          cache: true
      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile native Qt EXE
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Qt C++ compilation failed' }
          if (-not (Test-Path 'build/MAKET_296_QT6.exe')) { throw 'EXE not found' }
      - name: Smoke-test PDF PNG SVG
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force smoke | Out-Null
          # Windows GUI-subsystem EXEs must be explicitly awaited in PowerShell.
          foreach ($ext in @('pdf','png','svg')) {
            $out = "smoke/test_296.$ext"
            $proc = Start-Process -FilePath (Resolve-Path './build/MAKET_296_QT6.exe').Path -ArgumentList @('--render-smoke', $out) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Export failed: $ext (exit $($proc.ExitCode))" }
            if (-not (Test-Path $out)) { throw "Export failed: $ext (no output file)" }
          }
          python -m pip install --disable-pip-version-check --quiet Pillow PyMuPDF
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install export validators' }
          python scripts/check_exports.py smoke
          if ($LASTEXITCODE -ne 0) { throw 'Export dimensions or alpha verification failed' }
      - name: Test free photo objects, overlap, crop and editable layers
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force editor_smoke | Out-Null
          $test = Start-Process -FilePath (Resolve-Path './build/MAKET_296_QT6.exe').Path -ArgumentList @('--editor-smoke','editor_smoke') -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "Editor feature smoke test failed ($($test.ExitCode))" }
          python scripts/check_editor_features.py editor_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Editor feature verification failed' }
      - name: Build Qt layout and DTF print audit
        shell: pwsh
        run: |
          @'
          add_executable(MAKET296Audit scripts/audit_generator.cpp src/model.cpp src/renderer.cpp resources.qrc)
          target_include_directories(MAKET296Audit PRIVATE src)
          target_link_libraries(MAKET296Audit PRIVATE Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Svg)
          '@ | Add-Content -Path CMakeLists.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Audit configuration failed' }
          cmake --build build --target MAKET296Audit --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Audit harness compilation failed' }
          $env:QT_QPA_PLATFORM = 'windows'
          $audit = Start-Process -FilePath (Resolve-Path 'build/MAKET296Audit.exe').Path -Wait -PassThru -NoNewWindow
          if ($audit.ExitCode -ne 0) { throw "Audit render failed ($($audit.ExitCode))" }
          if (-not (Test-Path 'audit_render/layout.json')) { throw 'Audit results missing' }
      - name: Preflight actual 300-dpi DTF PNG PDF and SVG with filled photos
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow PyMuPDF
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install validation libraries' }
          python scripts/dtf_preflight.py audit_render
          if ($LASTEXITCODE -ne 0) { throw 'DTF preflight failed' }
      - name: Launch native Qt window and capture first-run UI
        shell: pwsh
        run: |
          @'
          add_executable(MAKET296GuiSmoke scripts/gui_smoke.cpp src/model.cpp src/renderer.cpp src/window.cpp resources.qrc)
          target_include_directories(MAKET296GuiSmoke PRIVATE src)
          target_link_libraries(MAKET296GuiSmoke PRIVATE Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Svg)
          '@ | Add-Content -Path CMakeLists.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'GUI test configuration failed' }
          cmake --build build --target MAKET296GuiSmoke --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'GUI test compilation failed' }
          $env:QT_QPA_PLATFORM = 'windows'
          $gui = Start-Process -FilePath (Resolve-Path 'build/MAKET296GuiSmoke.exe').Path -Wait -PassThru -NoNewWindow
          if ($gui.ExitCode -ne 0) { throw "Native Qt GUI startup failed ($($gui.ExitCode))" }
          if (-not (Test-Path 'audit_render/native_window.png')) { throw 'Native Qt UI screenshot missing' }
      - name: Upload 10 filled poster layouts and 20 photo-letter proofs
        uses: actions/upload-artifact@v4
        with:
          name: MAKET_296_QT6_DTF_audited_renders
          path: audit_render/
          retention-days: 7
          if-no-files-found: error
      - name: Bundle portable Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/MAKET_296_QT6.exe dist/MAKET_296_QT6.exe
          windeployqt --release --compiler-runtime dist/MAKET_296_QT6.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          if (-not (Test-Path dist/platforms/qwindows.dll)) { throw 'Qt Windows DLL missing' }
          Copy-Item examples dist/examples -Recurse
          if (Test-Path 'НАЧНИ_ЗДЕСЬ.txt') { Copy-Item 'НАЧНИ_ЗДЕСЬ.txt' 'dist/НАЧНИ_ЗДЕСЬ.txt' }
          Compress-Archive -Path dist/* -DestinationPath MAKET_296_QT6_Windows_portable.zip -Force
      - name: Upload EXE and Qt libraries
        uses: actions/upload-artifact@v4
        with:
          name: MAKET_296_QT6_Windows_portable
          path: MAKET_296_QT6_Windows_portable.zip
          retention-days: 14
          if-no-files-found: error
